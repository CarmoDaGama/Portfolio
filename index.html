    <script>
      // Apply the stored theme before first paint so the pre-rendered markup
      // never flashes in the wrong palette.
      (function () {
        var theme = 'dark';
        try {
          var stored = localStorage.getItem('theme');
          if (stored === 'light' || stored === 'dark') theme = stored;
        } catch (error) {
          /* localStorage unavailable (private mode, bots) - keep the default */
        }
        document.documentElement.classList.add(theme);
      })();
